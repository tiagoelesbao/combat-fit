name: CombatFit
options:
  bundleIdPrefix: com.tiagoelesbao.combatfit
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  CombatFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CombatFitIOS
      - path: Shared
    info:
      path: CombatFitIOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiagoelesbao.combatfit
    dependencies:
      - target: CombatFitWatch

  CombatFitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CombatFitWatch
      - path: Shared
    info:
      path: CombatFitWatch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiagoelesbao.combatfit.watchkitapp
