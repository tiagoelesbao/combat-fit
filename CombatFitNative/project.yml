name: CombatFit
options:
  bundleIdPrefix: com.tiagoelesbao.combatfit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  CombatFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CombatFitIOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiagoelesbao.combatfit
        INFOPLIST_KEY_CFBundleDisplayName: "CombatFit"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "O CombatFit precisa de acesso aos batimentos cardíacos para monitorar a intensidade dos treinos."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "O CombatFit grava os treinos de força e sprints no Apple Health."
    dependencies:
      - target: CombatFitWatch

  CombatFitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CombatFitWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiagoelesbao.combatfit.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: "CombatFit"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tiagoelesbao.combatfit
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Monitoramento de batimentos cardíacos no pulso."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Gravação de sessões no Apple Health."
        INFOPLIST_KEY_WKBackgroundModes: ["workout-processing"]
